    { id: 'motion.drift', type: 'range', label: 'Drift speed (power on)', min: 0.2, max: 3, step: 0.1, default: 1, group: 'Motion' },
    { id: 'motion.discharge', type: 'range', label: 'Discharge animation time (electrons cross, then the ion changes)', min: 0.2, max: 3, step: 0.1, default: 1.4, unit: 's', group: 'Motion' },
    { id: 'motion.bubbleSpeed', type: 'range', label: 'Bubble rise speed', min: 0.3, max: 3, step: 0.1, default: 1, group: 'Motion' },
    { id: 'motion.bubbleSize', type: 'range', label: 'Bubble size', min: 0.5, max: 2, step: 0.1, default: 1, group: 'Motion' },
    { id: 'motion.electronSpeed', type: 'range', label: 'Electron speed in wires', min: 0.2, max: 3, step: 0.1, default: 1, group: 'Motion' },
    { id: 'motion.electronSize', type: 'range', label: 'Electron size', min: 0.5, max: 3, step: 0.1, default: 1, group: 'Motion' },
    { id: 'motion.water', type: 'range', label: 'Water molecules shown', min: 0, max: 30, step: 1, default: 10, group: 'Motion' },
    { id: 'text.font', type: 'select', label: 'Font', options: FONTS, default: 'system-ui', group: 'Text' },
    { id: 'text.size', type: 'range', label: 'Text size', min: 10, max: 26, step: 1, default: 15, unit: 'px', group: 'Text' },
    { id: 'text.equationSize', type: 'range', label: 'Half-equation size', min: 12, max: 32, step: 1, default: 19, unit: 'px', group: 'Text' },
    { id: 'text.electrodeNames', type: 'segmented', label: 'Electrode names', options: [{ value: 'symbols', label: 'cathode (−)' }, { value: 'words', label: 'negative electrode' }, { value: 'both', label: 'Both' }], default: 'symbols', group: 'Text' },
    { id: 'text.flowText', type: 'segmented', label: 'Flow diagram text', options: [{ value: 'short', label: 'Short' }, { value: 'full', label: 'Full sentences' }], default: 'short', group: 'Text' },
    { id: 'text.flowSize', type: 'range', label: 'Flow diagram text size', min: 8, max: 20, step: 1, default: 13, unit: 'px', group: 'Text' },
    { id: 'text.showTitle', type: 'toggle', label: 'Show title', default: true, group: 'Text' },
    { id: 'text.showNote', type: 'toggle', label: 'Show teaching note', default: true, group: 'Text' },
    { id: 'text.showCounters', type: 'toggle', label: 'Show product counters', default: true, group: 'Text' },
    { id: 'text.showProductLabels', type: 'toggle', label: 'Show product labels', default: true, group: 'Text' },
    { id: 'text.showElectrodeLabels', type: 'toggle', label: 'Show electrode labels', default: true, group: 'Text' },
    { id: 'layout.cathodeSide', type: 'segmented', label: 'Cathode side', options: ['left', 'right'], default: 'left', group: 'Layout' },
    { id: 'layout.electrodeWidth', type: 'range', label: 'Electrode width', min: 0.02, max: 0.08, step: 0.005, default: 0.04, group: 'Layout' },
    { id: 'layout.beakerWidth', type: 'range', label: 'Beaker width (free mode)', min: 0.5, max: 0.9, step: 0.02, default: 0.72, group: 'Layout' },
    { id: 'layout.beakerWidthSteps', type: 'range', label: 'Beaker width (step mode)', min: 0.36, max: 0.7, step: 0.02, default: 0.5, group: 'Layout' },
    { id: 'layout.glow', type: 'toggle', label: 'Glow when ions discharge', default: true, group: 'Layout' },
    { id: 'layout.showSupply', type: 'toggle', label: 'Show power supply and wires', default: true, group: 'Layout' }
  );

  const controls = [
    { id: 'preset', type: 'select', label: 'Electrolyte', options: PRESETS.map(p => ({ value: p.id, label: p.title })), default: 'molten-pbbr2' },
    { id: 'guide', type: 'segmented', label: 'Mode', options: [{ value: 'steps', label: 'Step by step' }, { value: 'study', label: 'Study (questions)' }, { value: 'free', label: 'Free running' }], default: 'steps' },
    { id: 'difficulty', type: 'segmented', label: 'Question difficulty', options: [{ value: 'easy', label: 'Easy' }, { value: 'medium', label: 'Medium' }, { value: 'hard', label: 'Hard (type answers)' }], default: 'easy', showIf: v => v.guide === 'study' },
    { id: 'electrodes', type: 'segmented', label: 'Electrodes', options: [{ value: 'cathode', label: 'Cathode only' }, { value: 'anode', label: 'Anode only' }, { value: 'both', label: 'Both' }], default: 'both', showIf: v => v.guide !== 'free' },
    { id: 'next', type: 'button', label: 'Next step ›', primary: true, showIf: v => v.guide !== 'free' },
    { id: 'back', type: 'button', label: '‹ Back', showIf: v => v.guide !== 'free' },
    { id: 'power', type: 'toggle', label: 'Power on', default: false, showIf: v => v.guide === 'free' },
    { id: 'labels', type: 'segmented', label: 'Ion labels', options: ['formula', 'name', 'both', 'none'], default: 'formula' },
    { id: 'electrons', type: 'toggle', label: 'Show electron flow in wires', default: true, showIf: v => v.guide === 'free' },
    { id: 'equations', type: 'segmented', label: 'Half-equations', options: [{ value: 'auto', label: 'When it happens' }, { value: 'always', label: 'Always' }, { value: 'off', label: 'Off' }], default: 'auto', showIf: v => v.guide === 'free' },
    { id: 'water', type: 'toggle', label: 'Show water molecules', default: true, showIf: v => PRESET_BY_ID[v.preset] && PRESET_BY_ID[v.preset].state === 'aqueous' },
    { id: 'replenish', type: 'toggle', label: 'Replenish electrolyte ions (H⁺/OH⁻ from water always return)', default: true },
    { id: 'predict', type: 'toggle', label: 'Predict the products (hide until revealed)', default: false, showIf: v => v.guide === 'free' },
    { id: 'reveal', type: 'button', label: 'Reveal products', primary: true, showIf: v => v.guide === 'free' && v.predict }
  ];
  // Show only the cations or only the anions (so the class can watch positive ions go to the cathode and negative
  // ions to the anode separately). Hidden ions still take part in the simulation; they and their bubbles are not drawn.
  controls.splice(controls.findIndex(x => x.id === 'labels') + 1, 0, {
    id: 'ions', type: 'segmented', label: 'Ions shown', options: [{ value: 'cations', label: 'Cations (+) only' }, { value: 'anions', label: 'Anions (−) only' }, { value: 'both', label: 'Both' }], default: 'both'
  });
  const ionShown = (c, k) => c.ions === 'both' || !c.ions || (c.ions === 'cations') === (SPECIES[k].charge > 0);

  // ---------------------------------------------------------------- simulation
  function create(ctx) {
    const g = ctx.g;
    let preset, R, aqueous, ions, bubbles, deposits, counts, pending, gasCloud, shownEq, revealed, time, dissolved, anodeTimer, electronPhase, waters, flashes, owed = {}, refilling = {}, refillTimer = 0;
    let charge = 0;                       // electrons released at anode minus electrons taken at cathode
    const SLACK = 10;
    let steps = [], storyStep = 0, btnRects = {}, startCations = 0;
    const isStory = () => C().guide !== 'free';
    const isStudy = () => C().guide === 'study';
    let asked = {}, score = { right: 0, total: 0 };
    const flags = () => (isStory() && steps[storyStep]) ? steps[storyStep].flags : null;
    // Step/study mode can show one half of the cell: the other electrode, its wire, products, flow column and questions are dropped.
    const shownSide = () => { const e = C().electrodes; return isStory() && (e === 'cathode' || e === 'anode') ? e : null; };
    const showE = name => { const ss = shownSide(); return !ss || ss === name; };

    const C = () => ctx.controls.values;
    const D = () => ctx.design.values;
    const ionR = p => D()['ion.radius'] * D()['ion.' + p.k + '.radius'] * (g.w / 800);
    const productColour = k => D()['product.' + k + '.colour'] || SPECIES[k].product.colour;

    function layout() {
      const d = D(), w = g.w, h = g.h, s = w / 800;
      const story = isStory();
      const bw = w * (story ? d['layout.beakerWidthSteps'] : d['layout.beakerWidth']);
      const beaker = { x: (w - bw) / 2, y: h * 0.31, w: bw, h: h * 0.54 };
      const flowTop = h * 0.25, flowBottom = h * 0.84, m = w * 0.015;
      const flowLeft = { x: m, y: flowTop, w: beaker.x - 2 * m, h: flowBottom - flowTop };
      const flowRight = { x: beaker.x + beaker.w + m, y: flowTop, w: w - (beaker.x + beaker.w) - 2 * m, h: flowBottom - flowTop };
      const liquid = { x: beaker.x, y: beaker.y + beaker.h * 0.2, w: beaker.w, h: beaker.h * 0.8 };
      const ew = w * d['layout.electrodeWidth'];
      const left = beaker.x + beaker.w * 0.25, right = beaker.x + beaker.w * 0.75;
      const cathX = d['layout.cathodeSide'] === 'right' ? right : left;
      const anX = cathX === left ? right : left;
      const eTop = h * 0.255, eBot = liquid.y + liquid.h * 0.7;
      const anodeW = ew * (1 - Math.min(0.6, dissolved * 0.02));
      const cathLeft = cathX === left;
      return {
        s, beaker, liquid,
        flow: { cathode: cathLeft ? flowLeft : flowRight, anode: cathLeft ? flowRight : flowLeft },
        supply: { x: w / 2 - w * 0.085, y: h * 0.135, w: w * 0.17, h: h * 0.075 },
        cathode: { x: cathX - ew / 2, y: eTop, w: ew, h: eBot - eTop, cx: cathX, name: 'cathode', side: cathX === left ? -1 : 1 },
        anode: { x: anX - anodeW / 2, y: eTop, w: anodeW, h: eBot - eTop, cx: anX, name: 'anode', side: anX === left ? -1 : 1 },
        eqY: h * 0.91, counterY: h * 0.968
      };
    }
    const px = (p, L) => [L.liquid.x + p.u * L.liquid.w, L.liquid.y + p.v * L.liquid.h];
    const setPx = (p, x, y, L) => { p.u = (x - L.liquid.x) / L.liquid.w; p.v = (y - L.liquid.y) / L.liquid.h; };

    function newIon(k, fromWater, at) {
      let u = P.rand(0.04, 0.96);
      // keep clear of the electrodes at u = 0.25 and 0.75
      let tries = 0;
      while ((Math.abs(u - 0.25) < 0.08 || Math.abs(u - 0.75) < 0.08) && tries++ < 20) u = P.rand(0.04, 0.96);
      return { k, sp: SPECIES[k], u: at ? at.u : u, v: at ? at.v : P.rand(0.06, 0.94), vx: 0, vy: 0, state: 'free', t: 0, water: !!fromWater, side: 0 };
    }
    function populate() {
      const total = D()['motion.count'];
      const entries = Object.entries(preset.ions);
      const sum = entries.reduce((a, [, r]) => a + r, 0);
      const dilute = preset.dilute ? 0.4 : 1;
      entries.forEach(([k, ratio]) => {
        const n = Math.max(1, Math.round(total * ratio * dilute / sum));
        for (let i = 0; i < n; i++) ions.push(newIon(k));
      });
      if (aqueous) ['H+', 'OH-'].forEach(k => { if (!preset.ions[k]) for (let i = 0; i < (preset.dilute ? 10 : 6); i++) ions.push(newIon(k, true)); });
    }

    function reset(id) {
      preset = PRESET_BY_ID[id] || PRESETS[0];
      R = rules(preset);
      aqueous = preset.state === 'aqueous';
      steps = buildStory(); storyStep = 0;
      asked = {}; score = { right: 0, total: 0 };
      Quiz.close(ctx.overlay);
      resetState();
    }
    function resetState() {
      ions = []; bubbles = []; flashes = [];
      deposits = { cathode: [], anode: [] };
      counts = { cathode: 0, anode: 0 };
      pending = { cathode: 0, anode: 0 };
      gasCloud = { cathode: 0, anode: 0 };
      shownEq = { cathode: false, anode: false };
      revealed = false; time = 0; dissolved = 0; anodeTimer = 0; electronPhase = 0; charge = 0; owed = {}; refilling = {}; refillTimer = 0;
      if (!isStory()) populate();
      startCations = ions.filter(p => p.sp.charge > 0 && !p.water).length;
      waters = [];
      for (let i = 0; i < 30; i++) waters.push({ u: Math.random(), v: Math.random(), vx: 0, vy: 0, a: Math.random() * 6.28 });
    }

    function populateStory() {
      const entries = Object.entries(preset.ions);
      const unit = entries.reduce((a, [, r]) => a + r, 0);
      const mult = unit >= 4 || preset.dilute ? 1 : 2;
      const list = [];
      entries.forEach(([k, r]) => { for (let i = 0; i < r * mult; i++) list.push([k, false]); });
      if (aqueous) ['H+', 'OH-'].forEach(k => { if (!preset.ions[k]) for (let i = 0; i < 2; i++) list.push([k, true]); });
      // interleave cations and anions so the column is mixed
      const catsL = list.filter(x => SPECIES[x[0]].charge > 0), ansL = list.filter(x => SPECIES[x[0]].charge < 0);
      const ordered = [];
      while (catsL.length || ansL.length) { if (catsL.length) ordered.push(catsL.shift()); if (ansL.length) ordered.push(ansL.shift()); }
      const L = layout();
      const maxR = Math.max(...ordered.map(([k]) => ionR({ k })));
      const n = ordered.length;
      let spacing = maxR * 2.3, cols = 1;
      if (n * spacing > L.liquid.h * 0.9) { cols = 2; spacing = Math.min(spacing, L.liquid.h * 0.9 / Math.ceil(n / 2)); }
      const rows = Math.ceil(n / cols);
      ordered.forEach(([k, w], i) => {
        const col = i % cols, row = Math.floor(i / cols);
        const u = cols === 1 ? 0.5 : 0.5 + (col === 0 ? -1 : 1) * (maxR * 1.15 / L.liquid.w);
        const v = 0.5 + (row - (rows - 1) / 2) * spacing / L.liquid.h;
        ions.push(newIon(k, w, { u, v }));
      });
    }
    function topUp() {
      const total = D()['motion.count'];
      const entries = Object.entries(preset.ions);
      const sum = entries.reduce((a, [, r]) => a + r, 0);
      let guard = 0;
      while (ions.length < total && guard++ < 200) {
        let pick = Math.random() * sum;
        for (const [k, r] of entries) { pick -= r; if (pick <= 0) { ions.push(newIon(k)); break; } }
      }
    }
    function setStep(i, rebuild) {
      if (rebuild) resetState();
      storyStep = Math.max(0, Math.min(steps.length - 1, i));
      if (storyStep > 0 && !ions.length) { populateStory(); startCations = ions.filter(p => p.sp.charge > 0 && !p.water).length; }
      if (steps[storyStep].flags.free && C().replenish) topUp();
    }
    function action(id) {
      if (id === 'reveal') revealed = true;
      if (id === 'next') {
        if (ctx.overlay.childElementCount) return;              // a question is open
        if (storyStep >= steps.length - 1) reset(preset.id);
        else if (isStudy() && !asked[storyStep + 1] && questionsFor(storyStep + 1).length) openQuestion(storyStep + 1);
        else setStep(storyStep + 1);
      }
      if (id === 'back') { if (ctx.overlay.childElementCount) return; if (storyStep > 0) setStep(storyStep - 1, true); }
    }
    function onControl(id, v) {
      if (id === 'predict' && !v) revealed = false;
      if (id === 'guide' || id === 'electrodes' || id === 'difficulty') reset(preset.id);
    }

    const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
    function buildStory() {
      const side = shownSide(), both = !side;
      const cat = SPECIES[R.cathode], an = R.anode ? SPECIES[R.anode] : null;
      const keys = Object.keys(preset.ions);
      const cats = keys.filter(k => SPECIES[k].charge > 0), ans = keys.filter(k => SPECIES[k].charge < 0);
      const fl = k => SPECIES[k].formula;
      const join = arr => arr.length > 1 ? arr.slice(0, -1).join(', ') + ' and ' + arr[arr.length - 1] : arr[0];
      const f = {}, S = [];
      // add(text, flagPatch, highlight, flow) ; flow = { cathode: short, anode: short } or null
      const add = (text, patch, highlight, flow, key) => { Object.assign(f, patch || {}); S.push({ text, flags: Object.assign({}, f, { highlight: highlight || null }), flow: flow || null, key: key || null }); };
      const nC = Math.abs(cat.charge), nA = an ? Math.abs(an.charge) : 2;
      const catProd = cat.product, anProd = R.anodeDissolves ? COPPER_ANODE : an.product;
      const catDir = L0().cathode.side < 0 ? 'left' : 'right', anDir = catDir === 'left' ? 'right' : 'left';

      // Sentences and short labels, cathode side
      const cathode = {
        push: ['Switch on. Electrons are pushed from the negative (−) terminal of the power supply, along the wire, towards the ' + catDir + ' electrode.', 'Electrons pushed from the negative terminal to the electrode'],
        charged: ['The ' + catDir + ' electrode is now electron rich, so it has a negative charge. It is called the cathode.', 'Electrode is electron rich (negative): the cathode'],
        move: ['Positive ions (cations) are attracted to the negative cathode and move towards it.', 'Cations (+) attracted to the cathode'],
        compete: null,
        discharge: ['At the cathode each ' + cat.formula + ' ion gains ' + nC + (nC === 1 ? ' electron' : ' electrons') + ' from the cathode:   ' + catProd.eq, catProd.eq],
        product: [(catProd.type === 'metal' ? cap(catProd.name) + ' atoms form and build up on the cathode.' : cap(catProd.name) + ' gas forms as bubbles at the cathode.') + ' The ions have been reduced (they gained electrons).', cap(catProd.name) + ' forms (reduction)']
      };
      if (aqueous && cat.element !== 'H') cathode.compete = [cat.formula + ' and H^+ (from water) both reach the cathode. ' + cap(catProd.name) + ' is less reactive than hydrogen, so the ' + cat.formula + ' ions are discharged.', cat.formula + ' discharged, not H^+ (' + catProd.name + ' less reactive)'];
      else if (aqueous && cats.length && cats[0] !== 'H+') cathode.compete = [fl(cats[0]) + ' and H^+ (from water) both reach the cathode. ' + cap(SPECIES[cats[0]].product.name) + ' is more reactive than hydrogen, so the H^+ ions are discharged instead.', 'H^+ discharged, not ' + fl(cats[0]) + ' (' + SPECIES[cats[0]].product.name + ' more reactive)'];

      // Anode side
      const anode = {
        push: ['The positive (+) terminal of the power supply pulls electrons out of the ' + anDir + ' electrode, along the wire.', 'Electrons pulled from the electrode to the positive terminal'],
        charged: ['The ' + anDir + ' electrode is now electron poor, so it has a positive charge. It is called the anode.', 'Electrode is electron poor (positive): the anode'],
        move: ['Negative ions (anions) are attracted to the positive anode and move towards it.', 'Anions (−) attracted to the anode'],
        compete: null,
        discharge: R.anodeDissolves
          ? ['The copper anode is not inert. Copper atoms lose electrons to the anode and go into solution as Cu^2+ ions:   Cu → Cu^2+ + 2e^-', 'Cu → Cu^2+ + 2e^-']
          : ['At the anode each ' + an.formula + ' ion loses ' + nA + (nA === 1 ? ' electron' : ' electrons') + ' to the anode:   ' + anProd.eq, anProd.eq],
        product: R.anodeDissolves
          ? ['The anode slowly dissolves while the cathode gains copper. The electrons flow through the wire back to the positive terminal.', 'Anode dissolves']
          : [cap(anProd.name) + (anProd.vapour ? ' vapour' : ' gas') + ' forms at the anode. The ions have been oxidised (they lost electrons). The electrons flow back to the positive terminal.', cap(anProd.name) + ' forms (oxidation)']
      };
      if (!R.anodeDissolves && aqueous) {
        if (an.halide) anode.compete = [join(ans.map(fl)) + ' and OH^- (from water) both reach the anode. Halide ions are discharged, so ' + anProd.name + ' forms.', an.formula + ' discharged, not OH^- (halide)'];
        else if (preset.dilute) anode.compete = [join(ans.map(fl)) + ' and OH^- (from water) both reach the anode. The solution is dilute, so there are only a few ' + join(ans.map(fl)) + ' ions. OH^- ions are discharged instead and oxygen forms.', 'OH^- discharged, not ' + join(ans.map(fl)) + ' (dilute)'];
        else anode.compete = [join(ans.map(fl)) + ' and OH^- (from water) both reach the anode. ' + cap(join(ans.map(k => SPECIES[k].name + 's'))) + ' are not discharged. Instead OH^- ions are discharged and oxygen forms.', 'OH^- discharged, not ' + join(ans.map(fl))];
      }

      const obsC = OBS[catProd.formula], obsA = R.anodeDissolves ? OBS.dissolve : OBS[anProd.formula];
      const extraObs = preset.id === 'cuso4-inert' ? ' The blue colour of the solution slowly fades.' : preset.id === 'cuso4-copper' ? ' The solution stays blue.' : '';
      add(preset.title + '. Press Next to reveal the ions in the electrolyte.', {}, null, null, 'start');
      add(preset.title + ' contains ions that are free to move: ' + join(keys.map(fl)) + (aqueous ? ', plus a few H^+ and OH^- ions from the water.' : '.'), {}, 'ions', null, 'intro');
      // Each pair = one numbered step: sub-step a (cathode) then b (anode) in one-at-a-time mode, or one combined step in both mode.
      const pairs = [
        { key: 'push',
          a: [cathode.push[0], { power: true, eCath: true }, 'negTerminal', { cathode: cathode.push[1] }],
          b: [anode.push[0], { power: true, eAn: true }, 'posTerminal', { anode: anode.push[1] }],
          both: ['Switch on. Electrons are pushed from the negative terminal towards the ' + catDir + ' electrode, and pulled out of the ' + anDir + ' electrode into the positive terminal.', { power: true, eCath: true, eAn: true }, 'terminals', { cathode: cathode.push[1], anode: anode.push[1] }] },
        { key: 'charged',
          a: [cathode.charged[0], { cathodeCharged: true }, 'cathode', { cathode: cathode.charged[1] }],
          b: [anode.charged[0], { anodeCharged: true }, 'anode', { anode: anode.charged[1] }],
          both: ['The ' + catDir + ' electrode is now electron rich (negative): the cathode. The ' + anDir + ' electrode is electron poor (positive): the anode.', { cathodeCharged: true, anodeCharged: true }, 'electrodes', { cathode: cathode.charged[1], anode: anode.charged[1] }] },
        { key: 'move',
          a: [cathode.move[0], { cationsMove: true }, 'cations', { cathode: cathode.move[1] }],
          b: [anode.move[0], { anionsMove: true }, 'anions', { anode: anode.move[1] }],
          both: ['Cations (+) are attracted to the negative cathode; anions (−) are attracted to the positive anode.', { cationsMove: true, anionsMove: true }, 'ions', { cathode: cathode.move[1], anode: anode.move[1] }] },
        { key: 'compete',
          a: cathode.compete && [cathode.compete[0], {}, 'cathode', { cathode: cathode.compete[1] }],
          b: anode.compete && [anode.compete[0], {}, 'anode', { anode: anode.compete[1] }],
          both: (cathode.compete || anode.compete) && [[cathode.compete && cathode.compete[0], anode.compete && anode.compete[0]].filter(Boolean).join(' '), {}, 'electrodes', { cathode: cathode.compete && cathode.compete[1], anode: anode.compete && anode.compete[1] }] },
        { key: 'discharge',

          b: [anode.discharge[0], { anodeDischarge: true }, 'anode', { anode: anode.discharge[1] }],
          both: ['Cathode: ' + catProd.eq + '     Anode: ' + anProd.eq, { cathodeDischarge: true, anodeDischarge: true }, 'electrodes', { cathode: cathode.discharge[1], anode: anode.discharge[1] }] },
        { key: 'product',

          b: [anode.product[0], {}, null, { anode: anode.product[1] }],

        { key: 'observe',
          a: ['What you would observe at the cathode: ' + obsC.text + '.', { observeC: true }, 'cathode', { cathode: 'Observe: ' + obsC.short }],
          b: ['What you would observe at the anode: ' + obsA.text + '.' + extraObs, { observeA: true }, 'anode', { anode: 'Observe: ' + obsA.short }],
          both: ['Observations. Cathode: ' + obsC.text + '. Anode: ' + obsA.text + '.' + extraObs, { observeC: true, observeA: true }, 'electrodes', { cathode: 'Observe: ' + obsC.short, anode: 'Observe: ' + obsA.short }] }

    }
    function L0() { const d = D(); return { cathode: { side: d['layout.cathodeSide'] === 'right' ? 1 : -1 } }; }

    // ------------------------------------------------------------ study questions
    const norm = t => String(t || '').toLowerCase()
      .replace(/[−–]/g, '-').replace(/→|=>|->|=/g, '>')
      .replace(/[⁺]/g, '+').replace(/[⁻]/g, '-')
      .replace(/[²]/g, '2').replace(/[³]/g, '3').replace(/[₂]/g, '2').replace(/[₃]/g, '3').replace(/[₄]/g, '4')
      .replace(/[\^_\s]/g, '').replace(/ions?$/g, '').replace(/e-/g, 'e');
    const normIon = t => norm(t).replace(/ion$/, '').replace(/^(\d)([a-z])/, '$2$1').replace(/^([a-z]+)(\d?)([+-])$/, (m, el, n, sg) => el + (n || '1') + sg);
    const splitList = t => String(t || '').split(/\s*(?:,|;|\band\b|&|\s\+\s)\s*/).map(x => x.trim()).filter(Boolean);
    const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
    const opt = (label, correct) => ({ label, correct: !!correct });
    const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));
    const ionAliases = k => { const sp = SPECIES[k]; return [normIon(sp.formula), norm(sp.name)]; };
    const eqVariants = eq => {
      const [lhs, rhs] = eq.split('→').map(x => x.trim());
      const terms = lhs.split(' + ');
      const rterms = rhs.split(' + ');
      const out = [];
      const perms = terms.length === 2 ? [terms, [terms[1], terms[0]]] : [terms];
      const rperms = rterms.length === 2 ? [rterms, [rterms[1], rterms[0]]] : [rterms];
      perms.forEach(l => rperms.forEach(r => out.push(norm(l.join(' + ') + ' → ' + r.join(' + ')))));
      return out;
    };
    const wrongCharge = k => {
      const sp = SPECIES[k], el = sp.formula.split('^')[0];
      const c = sp.charge, mag = Math.abs(c), sign = c > 0 ? '+' : '-', flip = c > 0 ? '-' : '+';
      const alt = [];
      alt.push(el + '^' + (mag === 1 ? '' : mag) + flip);                       // wrong sign
      alt.push(el + '^' + (mag === 1 ? '2' : mag === 2 ? '' : '2') + sign);   // wrong size
      return alt;
    };
    const POOL_IONS = ['Pb2+', 'Br-', 'Na+', 'Cl-', 'Cu2+', 'SO42-', 'H+', 'OH-', 'Al3+', 'O2-'];
    const POOL_PRODUCTS = ['lead', 'bromine', 'sodium', 'chlorine', 'aluminium', 'oxygen', 'hydrogen', 'copper'];

    function questionsFor(i) {
      const st = steps[i]; if (!st || !st.key) return [];
      const hasCompete = steps.some(x => x.key === 'compete');
      const keys = { intro: ['intro'], push: ['push'], charged: ['charged'], move: ['move'],
        compete: ['discharge'], discharge: hasCompete ? ['product'] : ['discharge', 'product'], product: [], observe: ['observe'] }[st.key] || [];
      return keys.map(buildQuestion).map(sideOnly).filter(Boolean);
    }
    // In cathode-only / anode-only mode drop the parts of a question about the hidden electrode.
    function sideOnly(q) {
      const side = shownSide(); if (!q || !side) return q;
      const sideOf = t => /cathode|negativ/i.test(t) ? 'cathode' : /anode|positiv/i.test(t) ? 'anode' : null;
      const keep = (label, answer) => (sideOf(String(label || '')) || sideOf(String(answer || '')) || side) === side;
      q = Object.assign({}, q);
      if (q.prompt) q.prompt = q.prompt.replace(/each electrode/g, 'the ' + side);
      if (q.match) { q.match = Object.assign({}, q.match, { left: q.match.left.filter(it => keep(it.label, it.answer)) }); if (!q.match.left.length) return null; }
      if (q.typed && q.typed.fields) { q.typed = { fields: q.typed.fields.filter(fd => keep(fd.label, fd.answer)) }; if (!q.typed.fields.length) return null; }
      if (q.gaps) {
        const idx = q.gaps.answers.map((a, i) => keep(a.join(' ')) ? i : -1).filter(i => i >= 0);
        if (!idx.length) return null;
        q.gaps = Object.assign({}, q.gaps, { sentences: idx.map(i => q.gaps.sentences[i]), answers: idx.map(i => q.gaps.answers[i]) });
      }
      return q;
    }
    function questionFor(i) { return questionsFor(i)[0] || null; }
    function buildQuestion(key) {
      const diff = C().difficulty || 'easy';
      const hard = diff === 'hard', medium = diff === 'medium';
      const cat = SPECIES[R.cathode], an = R.anode ? SPECIES[R.anode] : null;
      const catProd = cat.product, anProd = R.anodeDissolves ? COPPER_ANODE : an.product;
      const keys = Object.keys(preset.ions);
      const present = keys.slice(); if (aqueous) ['H+', 'OH-'].forEach(k => { if (!present.includes(k)) present.push(k); });
      const cations = present.filter(k => SPECIES[k].charge > 0), anions = present.filter(k => SPECIES[k].charge < 0);
      const fl = k => SPECIES[k].formula;
      const catDir = L0().cathode.side < 0 ? 'left' : 'right', anDir = catDir === 'left' ? 'right' : 'left';
      const nC = Math.abs(cat.charge), nA = an ? Math.abs(an.charge) : 2;
      const other = n => n === 1 ? 2 : 1;
      const plural = n => n + (n === 1 ? ' electron' : ' electrons');
      const typedSet = (correctKeys, placeholder, label) => ({
        label, placeholder, answer: correctKeys.map(fl).join(' and '),
        check: t => { const got = splitList(t).map(normIon); const ok = correctKeys.map(ionAliases); return got.length === ok.length && ok.every(al => got.some(g => al.includes(g))) && got.every(g => ok.some(al => al.includes(g))); }
      });
      const typedWords = (answers, answer, placeholder, label) => ({ label, placeholder, answer, check: t => answers.map(norm).includes(norm(t)) });
      const typedEq = (eq, label) => ({ label, placeholder: 'e.g. X^2+ + 2e^- → X', answer: eq, check: t => eqVariants(eq).includes(norm(t)) });
      const ionOptions = correct => {
        const opts = correct.map(k => opt(fl(k), true));
        if (medium) {
          correct.forEach(k => wrongCharge(k).forEach(w => opts.push(opt(w, false))));
          shuffle(POOL_IONS.filter(k => !correct.includes(k))).slice(0, 3).forEach(k => opts.push(opt(wrongCharge(k)[Math.random() < 0.5 ? 0 : 1], false)));
          return shuffle(opts);
        }
        const distract = shuffle(POOL_IONS.filter(k => !correct.includes(k)));
        while (opts.length < Math.max(4, correct.length + 2) && distract.length) opts.push(opt(fl(distract.shift()), false));
        return shuffle(opts);
      };
      const productOptions = correctName => {
        const opts = [opt(correctName, true)];
        shuffle(POOL_PRODUCTS.filter(x => x !== correctName)).slice(0, 3).forEach(x => opts.push(opt(x, false)));
        return shuffle(opts);
      };
      const competeQ = (a, b, where, correct) => ({
        prompt: fl(a) + ' and ' + fl(b) + ' both reach the ' + where + '. Which ion is discharged?',
        options: hard ? null : shuffle([opt(fl(a), correct === a), opt(fl(b), correct === b)].concat(medium ? [opt('Both', false), opt('Neither', false)] : [])),
        typed: hard ? typedSet([correct], 'Type the ion, e.g. X^2+') : null
      });
      const anodeDischargeLabel = R.anodeDissolves ? 'Copper atoms of the anode' : null;
      const anodeHappens = R.anodeDissolves
        ? ['Copper atoms lose 2 electrons and go into solution as Cu^2+ ions: the anode dissolves', 'Copper atoms gain 2 electrons: the anode grows']
        : [an.formula + ' ions lose ' + plural(nA) + ': ' + anProd.name + ' forms', an.formula + ' ions gain ' + plural(nA) + ': ' + anProd.name + ' forms'];
      const cathodeHappens = [cat.formula + ' ions gain ' + plural(nC) + ': ' + catProd.name + ' forms', cat.formula + ' ions lose ' + plural(nC) + ': ' + catProd.name + ' forms'];

      switch (key) {
        case 'intro': return {
          prompt: 'Which ions are present in ' + preset.title.charAt(0).toLowerCase() + preset.title.slice(1) + '?',
          hint: aqueous ? 'Include the ions from water.' : (medium ? 'Check the charges carefully.' : null),
          multi: !hard, options: hard ? null : ionOptions(present),
          typed: hard ? typedSet(present, 'e.g. X^2+ and Y^-') : null
        };
        case 'push': {
          const bank = ['pushed from', 'pulled from', 'negative terminal', 'positive terminal', 'cathode', 'anode'];
          if (medium) bank.push('pushed to', 'pulled to');
          return {
            prompt: 'The power is switched on. Fill in the gaps. Click a gap, then click a word.',
            gaps: hard ? null : {
              sentences: [['Electrons are', '', 'the', '', 'to the', ''], ['Electrons are', '', 'the', '', 'to the', '']],
              answers: [['pushed from', 'negative terminal', 'cathode'], ['pulled from', 'anode', 'positive terminal']],
              bank: shuffle(bank), unordered: true
            },
            typed: hard ? { fields: [
              typedWords(['negative', 'negative terminal', 'the negative terminal', 'neg', '-', '−'], 'negative', 'negative or positive', 'Which terminal pushes electrons out into the wire?'),
              typedWords(['positive', 'positive terminal', 'the positive terminal', 'pos', '+'], 'positive', 'negative or positive', 'Which terminal pulls electrons in from the wire?')
            ] } : null
          };
        }
        case 'charged': {
          const gains = 'Gains electrons, so it is negatively charged', loses = 'Loses electrons, so it is positively charged';
          const right = [gains, loses];
          if (medium) right.push('Gains electrons, so it is positively charged', 'Loses electrons, so it is negatively charged');
          return {
            prompt: 'Match each electrode to what happens to it. Click an electrode, then click its partner.',
            match: hard ? null : { left: [{ label: 'Electrode connected to the negative terminal', answer: gains }, { label: 'Electrode connected to the positive terminal', answer: loses }], right: shuffle(right) },
            typed: hard ? { fields: [
              typedWords(['cathode', 'the cathode', 'negative cathode'], 'cathode', 'cathode or anode', 'The electrode connected to the negative terminal gains electrons. It is called the...'),
              typedWords(['anode', 'the anode', 'positive anode'], 'anode', 'cathode or anode', 'The electrode connected to the positive terminal loses electrons. It is called the...')
            ] } : null
          };
        }
        case 'move': {
          const right = ['Cathode (negative electrode)', 'Anode (positive electrode)'];
          if (medium) right.push('Does not move');
          return {
            prompt: 'Which electrode does each ion move towards? Click an ion, then click the electrode.',
            match: hard ? null : { left: shuffle(present).map(k => ({ label: fl(k), answer: SPECIES[k].charge > 0 ? right[0] : right[1] })), right },
            typed: hard ? { fields: [typedSet(cations, 'e.g. X^2+', 'Ions that move to the cathode'), typedSet(anions, 'e.g. Y^-', 'Ions that move to the anode')] } : null
          };
        }
        case 'discharge': {
          const right = shuffle(present.map(fl).concat(anodeDischargeLabel ? [anodeDischargeLabel] : []));
          if (medium && !anodeDischargeLabel) right.push('Copper atoms of the anode');
          return {
            prompt: hard ? 'What is discharged at each electrode?' : 'What is discharged at each electrode? Click an electrode, then click what is discharged there.',
            match: hard ? null : { left: [{ label: 'At the cathode (negative)', answer: fl(R.cathode) }, { label: 'At the anode (positive)', answer: anodeDischargeLabel || fl(R.anode) }], right },
            typed: hard ? { fields: [
              typedSet([R.cathode], 'e.g. X^2+', 'Ion discharged at the cathode'),
              R.anodeDissolves ? { label: 'What is discharged (loses electrons) at the anode?', placeholder: 'what loses electrons?', answer: 'copper atoms of the anode', check: t => /copper|^cu$|cuatom|anode/.test(norm(t)) } : typedSet([R.anode], 'e.g. Y^-', 'Ion discharged at the anode')
            ] } : null

          const pool = OBS_POOL.filter(k => OBS[k] !== obsC && OBS[k] !== obsA);
          const right = shuffle([cap1(obsC.short), cap1(obsA.short)].concat(shuffle(pool).slice(0, medium ? 3 : 2).map(k => cap1(OBS[k].short))));
          return {
            prompt: hard ? 'What would you observe at each electrode?' : 'What would you observe at each electrode? Click an electrode, then click the observation.',
            match: hard ? null : { left: [{ label: 'At the cathode (negative)', answer: cap1(obsC.short) }, { label: 'At the anode (positive)', answer: cap1(obsA.short) }], right },
            typed: hard ? { fields: [
              { label: 'Observation at the cathode', placeholder: 'What would you see, hear or smell?', answer: obsC.text, check: t => obsC.match.test(norm(t)) },
              { label: 'Observation at the anode', placeholder: 'What would you see, hear or smell?', answer: obsA.text, check: t => obsA.match.test(norm(t)) }
            ] } : null
          };
        }
        case 'product': {

          return {
            prompt: hard ? 'Write the half-equation for each electrode.' : 'What happens at each electrode? Click an electrode, then click what happens there.',
            match: hard ? null : { left: [{ label: 'Cathode (negative)', answer: cathodeHappens[0] }, { label: 'Anode (positive)', answer: anodeHappens[0] }], right },
            typed: hard ? { fields: [typedEq(catProd.eq, 'Half-equation at the cathode'), typedEq(R.anodeDissolves ? COPPER_ANODE.eq : anProd.eq, 'Half-equation at the anode')] } : null,
            hint: hard ? 'Use → or -> for the arrow, e- for an electron.' : null

    }

    function openQuestion(i) {
      const qs = questionsFor(i);

      let k = 0;
      const askNext = () => {
        if (k >= qs.length) { finish(); return; }
        Quiz.ask(ctx.overlay, qs[k++], firstTry => { score.total++; if (firstTry) score.right++; askNext(); });
      };

    // ------------------------------------------------------------ update
    function update(dt) {
      const c = C(), d = D(), L = layout(), s = L.s;

      const jitter = d['motion.jitter'] * 900 * s * (f && !f.free ? 0.25 : 1);
      const drift = d['motion.drift'] * 320 * s;
      const maxV = 150 * s * Math.max(1, d['motion.drift']);
      const dischargeTime = d['motion.discharge'];
      const anodeSupply = R.anodeDissolves || ions.some(p => p.k === R.anode && p.state === 'free');
      const cathodeSupply = ions.some(p => p.k === R.cathode && p.state === 'free');

      for (let i = ions.length - 1; i >= 0; i--) {
        const p = ions[i];
        const r = ionR(p);
        let [x, y] = px(p, L);
        if (p.state === 'free') {
          P.wander(p, jitter, dt);
          const target = p.sp.charge > 0 ? L.cathode : L.anode;
          const mayMove = !f || f.free || (p.sp.charge > 0 ? f.cationsMove : f.anionsMove);
          if (power && mayMove) {
            const spectator = !(p.k === R.cathode || p.k === R.anode);
            p.vx += Math.sign(target.cx - x) * drift * (spectator ? 0.6 : 1) * dt;
            const other = target === L.cathode ? L.anode : L.cathode;
            const between = showE(other.name) && (other.cx - x) * (target.cx - x) < 0;   // other electrode lies in the way
            if (between && Math.abs(other.cx - x) < other.w / 2 + r * 3 && y < other.y + other.h + r * 1.5) p.vy += drift * 1.2 * dt;
            // parked underneath the target electrode: rise up to its face so it can be discharged
            const underTarget = y > target.y + target.h - r && Math.abs(target.cx - x) < target.w / 2 + r * 2.5;
            if (underTarget) { p.vy -= drift * 1.5 * dt; p.vx += (x < target.cx ? -1 : 1) * drift * 0.4 * dt; }
          }
          P.clampSpeed(p, maxV);
          x += p.vx * dt; y += p.vy * dt;
          for (const E of [L.cathode, L.anode]) {
            if (!showE(E.name)) continue;
            const inY = y > E.y - r && y < E.y + E.h + r;
            if (inY && x > E.x - r && x < E.x + E.w + r) {
              const isTarget = E === target;
              const balanced = f ? true : (E.name === 'cathode' ? (charge > -SLACK || !anodeSupply) : (charge < SLACK || !cathodeSupply));
              const allowed = !f || f.free || (E.name === 'cathode' ? f.cathodeDischarge : f.anodeDischarge);
              const canDischarge = power && isTarget && balanced && allowed &&
                ((E.name === 'cathode' && p.k === R.cathode) || (E.name === 'anode' && p.k === R.anode));
              if (canDischarge) { startDischarge(p, E, x, y, r, L); break; }
              const side = x < E.cx ? -1 : 1;
              const standoff = (isTarget && power && !((E.name === 'cathode' && p.k === R.cathode) || (E.name === 'anode' && p.k === R.anode))) ? r * 1.6 : r + 0.5;
              x = E.cx + side * (E.w / 2 + standoff);
              p.vx = -p.vx * 0.3;
              // wrong electrode in the way: slide down and go underneath it
              if (power && mayMove && !isTarget) p.vy = Math.max(p.vy, 110 * s);
            }
          }
          const tmp = { x, y, vx: p.vx, vy: p.vy };
          P.confine(tmp, L.liquid, r, 0.5);
          p.vx = tmp.vx; p.vy = tmp.vy;
          if (p.state === 'free') setPx(p, tmp.x, tmp.y, L);

          p.t += dt;
          if (p.t >= dischargeTime) finishDischarge(p, i, L);
        } else if (p.state === 'emerging') {
          p.t += dt;
          if (p.t >= 0.6) p.state = 'free';
        }
      }

      // keep free ions apart
      const isDischarger = p => p.k === R.cathode || p.k === R.anode;
      const free = ions.filter(p => p.state === 'free').map(p => { const [x, y] = px(p, L); return { p, x, y, group: power ? (isDischarger(p) ? 1 : 0) : 0 }; });
      P.separate(free, o => ionR(o.p), 2, (a, b) => a.group === b.group);
      free.forEach(o => setPx(o.p, o.x, o.y, L));

      // bubbles
      const rise = d['motion.bubbleSpeed'] * 55 * s;
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        b.y -= rise * dt; b.phase += dt * 4;
        if (b.y - b.r < L.liquid.y) { gasCloud[b.E] = Math.min(1, gasCloud[b.E] + 0.12); bubbles.splice(i, 1); }
      }

      // copper anode dissolving
      if (power && R.anodeDissolves && (!f || f.free || f.anodeDischarge)) {
        anodeTimer += dt;
        const period = 0.55 / d['motion.drift'];
        if (anodeTimer > period && (f || charge < SLACK || !cathodeSupply)) { anodeTimer = 0; charge += 2; dissolveStep(L); }
      }
      // deferred replenishment: let the ions already present discharge first, then a fresh batch drifts in
      refillTimer += dt;
      for (const k in owed) {
        if (!(owed[k] > 0)) { refilling[k] = false; continue; }
        const freeK = ions.reduce((n, q) => n + (q.k === k && q.state === 'free' ? 1 : 0), 0);
        if (freeK <= 1) refilling[k] = true;
        if (refilling[k] && refillTimer > 0.15) { refillTimer = 0; owed[k]--; ions.push(newIon(k)); }
      }
      if (power && (f || c.electrons)) electronPhase += dt * d['motion.electronSpeed'];
      if (!f && c.equations === 'always') shownEq.cathode = shownEq.anode = true;

      // water molecules drift slowly
      waters.forEach(wm => { P.wander(wm, 40 * s, dt, 1); wm.u += wm.vx * dt / L.liquid.w; wm.v += wm.vy * dt / L.liquid.h; wm.a += dt * 0.3;
        if (wm.u < 0.02 || wm.u > 0.98) { wm.vx *= -1; wm.u = Math.min(0.98, Math.max(0.02, wm.u)); }
        if (wm.v < 0.02 || wm.v > 0.98) { wm.vy *= -1; wm.v = Math.min(0.98, Math.max(0.02, wm.v)); } });
    }

    function startDischarge(p, E, x, y, r, L) {
      p.state = 'discharging'; p.t = 0;
      p.side = x < E.cx ? -1 : 1;
      p.electrode = E.name;
      charge += E.name === 'cathode' ? -Math.abs(p.sp.charge) : Math.abs(p.sp.charge);
      const sx = E.cx + p.side * (E.w / 2 + r * 1.9);
      const sy = Math.min(Math.max(y, L.liquid.y + r), E.y + E.h - r);
      setPx(p, sx, sy, L);
      p.vx = p.vy = 0;
    }

    function finishDischarge(p, i, L) {
      const E = p.electrode, prod = p.sp.product;
      ions.splice(i, 1);
      shownEq[E] = true;
      if (prod.type === 'metal') {
        counts[E]++;
        if (deposits[E].length < 80) deposits[E].push({ side: p.side, v: p.v, r: ionR(p) * 0.8, k: p.k });
      } else {
        pending[E]++;
        if (pending[E] >= prod.n) { pending[E] -= prod.n; counts[E]++; spawnBubble(E, p, L); }
      }
      const cationFromAnode = R.anodeDissolves && p.sp.charge > 0;
      const f = flags();
      const replenish = (p.water || !!C().replenish) && (!f || f.free);
      // water ions return at once (water is effectively infinite); electrolyte ions are owed and
      // only return once the ones already present have been discharged (see update)
      if (replenish && !cationFromAnode) { if (p.water) ions.push(newIon(p.k, true)); else owed[p.k] = (owed[p.k] || 0) + 1; }
    }

    function spawnBubble(E, p, L) {
      const d = D(), el = L[E];
      const [, y] = px(p, L);
      const base = 7 * L.s * d['motion.bubbleSize'] * P.rand(0.8, 1.25);
      bubbles.push({ E, k: p.k, side: p.side, x0: el.cx + p.side * (el.w / 2 + base + 2), y, r: base, phase: Math.random() * 6.28 });
    }

    function dissolveStep(L) {
      dissolved++; counts.anode++; shownEq.anode = true;
      const el = L.anode, side = -el.side;
      flashes.push({ x: el.cx + side * el.w / 2, y: L.liquid.y + P.rand(0.1, 0.8) * L.liquid.h, t: 0 });
      if (ions.length > 90) return;
      const p = newIon('Cu2+');
      p.state = 'emerging'; p.t = 0; p.side = side;
      const r = ionR(p);
      setPx(p, el.cx + side * (el.w / 2 + r + 1), L.liquid.y + P.rand(0.1, 0.8) * L.liquid.h, L);
      ions.push(p);
    }

    // ------------------------------------------------------------ draw
    function draw() {
      const c = C(), d = D(), L = layout(), s = L.s;
      const f = flags();
      const hidden = !f && !!c.predict && !revealed;
      const font = d['text.font'], ts = d['text.size'] * s, textCol = d['colour.text'];
      const T = (x, y, str, o) => g.text(x, y, str, Object.assign({ font, size: ts, color: textCol }, o));
      const F = (x, y, str, o) => g.formula(x, y, str, Object.assign({ font, size: ts, color: textCol }, o));

      g.begin(d['colour.background']);

      const headW = g.w * 0.95;
      if (d['text.showTitle']) {
        g.formulaFit(g.w * 0.025, g.h * 0.05, preset.title + '   ' + preset.formula, { font, size: ts * 1.2, color: textCol, weight: '700', baseline: 'middle' }, headW);
      }
      if (!f && d['text.showNote'] && preset.note) {
        const o = { font, size: ts * 0.8, color: g.withAlpha(textCol, 0.75) };
        wrap(preset.note, headW, o).slice(0, 2).forEach((line, i) => g.text(g.w * 0.025, g.h * 0.05 + ts * (1.45 + i * 0.95), line, o));
      }

      if (d['layout.showSupply']) drawCircuit(L, d, c);

      // beaker and liquid
      let liquidCol = (d['colour.usePresetLiquid'] && preset.liquid) ? preset.liquid : (aqueous ? d['colour.liquidAqueous'] : d['colour.liquidMolten']);
      if (preset.fades && d['colour.usePresetLiquid'] && preset.liquid) {
        const supply = c.replenish ? 40 : Math.max(6, startCations);
        liquidCol = g.mix(preset.liquid, '#f8fbff', counts.cathode / supply);
      }
      g.rect(L.liquid.x, L.liquid.y, L.liquid.w, L.liquid.h, liquidCol);
      g.line(L.liquid.x, L.liquid.y, L.liquid.x + L.liquid.w, L.liquid.y, g.withAlpha(d['colour.glass'], 0.5), 1.5 * s);
      g.path([[L.beaker.x, L.beaker.y], [L.beaker.x, L.beaker.y + L.beaker.h], [L.beaker.x + L.beaker.w, L.beaker.y + L.beaker.h], [L.beaker.x + L.beaker.w, L.beaker.y]], d['colour.glass'], 3 * s);

      if (aqueous && c.water) drawWater(L, d, c);

      if (showE('cathode')) drawElectrode(L.cathode, L, d, hidden);
      if (showE('anode')) drawElectrode(L.anode, L, d, hidden);

      ions.forEach(p => { if (ionShown(c, p.k)) drawIon(p, L, d, c); });
      bubbles.forEach(b => { if (ionShown(c, b.k) && showE(b.E)) drawBubble(b, L, d, c, hidden); });
      flashes.forEach(f => g.alpha(1 - f.t * 2, () => g.circle(f.x, f.y, 6 * s + f.t * 20 * s, null, d['colour.electron'], 2 * s)));

      ['cathode', 'anode'].forEach(E => { if (showE(E)) drawProducts(E, L, d, hidden); });
      if (d['text.showElectrodeLabels']) ['cathode', 'anode'].forEach(E => { if (showE(E)) drawElectrodeLabel(L[E], L, d); });
      if (f) {
        if (f.observeC) drawObservation(L.cathode, OBS[SPECIES[R.cathode].product.formula], L, d);
        if (f.observeA) drawObservation(L.anode, R.anodeDissolves ? OBS.dissolve : OBS[SPECIES[R.anode].product.formula], L, d);
        if (f.highlight) drawHighlight(f.highlight, L, d); drawFlow(L, d); drawStory(L, d);
      }
      else drawEquations(L, d, c, hidden);

      if (hidden) {
        const msg = 'Predict the products!';
        const w = g.textWidth(msg, { font, size: ts, weight: '700' }) + 24 * s;
        g.roundRect(g.w - w - 12 * s, g.h * 0.03, w, ts * 2, 8 * s, '#fef08a', '#ca8a04', 1.5 * s);
        T(g.w - 12 * s - w / 2, g.h * 0.03 + ts, msg, { align: 'center', weight: '700', color: '#713f12' });
      }
    }

    function wrap(text, maxW, o) {
      const words = text.split(' '), lines = []; let cur = '';
      words.forEach(w => {
        const t = cur ? cur + ' ' + w : w;
        if (g.textWidth(t, o) > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
      });
      if (cur) lines.push(cur);
      return lines.slice(0, 3);
    }

    function electrodeColour(E, d) { return preset.electrodes === 'copper' ? d['colour.copper'] : d['colour.graphite']; }

    function drawElectrode(E, L, d, hidden) {
      const s = L.s;
      const col = electrodeColour(E, d);
      g.rect(E.x, E.y, E.w, E.h, col);
      g.rect(E.x, E.y, E.w * 0.25, E.h, g.withAlpha('#ffffff', 0.15));
      const f = flags();
      if (f && (E.name === 'cathode' ? f.cathodeCharged : f.anodeCharged)) {
        const sign = E.name === 'cathode' ? '−' : '+';
        const top = L.liquid.y + 14 * s, bottom = E.y + E.h - 10 * s, n = 5;
        for (let i = 0; i < n; i++) g.text(E.cx, top + (bottom - top) * i / (n - 1), sign, { size: Math.min(E.w * 0.9, 18 * s), color: '#ffffff', align: 'center', weight: '800' });
      }
      // deposit layer plus atoms
      const list = deposits[E.name];
      const count = counts[E.name];
      if (SPECIES[R[E.name]] && SPECIES[R[E.name]].product.type === 'metal' && !R.anodeDissolves || (E.name === 'cathode' && R.anodeDissolves)) {
        const pc = hidden ? '#9ca3af' : productColour(R.cathode);
        const top = L.liquid.y + 4 * s, bottom = E.y + E.h;
        if (count > 0) g.alpha(Math.min(1, count / 20), () => g.rect(E.x, top, E.w, bottom - top, pc));
        const thick = Math.min(E.w * 0.9, Math.max(0, count - 12) * 0.35 * s);
        if (thick > 0) {
          g.rect(E.x - thick, top, E.w + 2 * thick, bottom - top + thick, pc);
        }
        list.forEach(a => {
          const x = E.cx + a.side * (E.w / 2 + thick + a.r * 0.75);
          const y = L.liquid.y + a.v * L.liquid.h;
          g.circle(x, y, a.r, pc, g.darken(pc, 0.3), 1);
        });
      }
    }

    function drawElectrodeLabel(E, L, d) {
      const s = L.s, ts = d['text.size'] * s, font = d['text.font'];
      const neg = E.name === 'cathode';
      const mode = d['text.electrodeNames'];
      const f = flags();
      const named = !f || (neg ? f.cathodeCharged : f.anodeCharged);
      if (!named) { g.text(E.cx + E.side * (E.w / 2 + 8 * s), E.y + ts * 0.7, 'electrode', { font, size: ts, color: g.withAlpha(d['colour.text'], 0.7), align: E.side < 0 ? 'right' : 'left', weight: '600' }); return; }
      const sym = neg ? 'cathode (−)' : 'anode (+)';
      const words = neg ? 'negative electrode' : 'positive electrode';
      let label = mode === 'words' ? words : sym;
      const x = E.cx + E.side * (E.w / 2 + 8 * s);
      const align = E.side < 0 ? 'right' : 'left';
      g.text(x, E.y + ts * 0.7, label, { font, size: ts, color: d['colour.text'], align, weight: '700' });
      if (mode === 'both') g.text(x, E.y + ts * 1.9, words, { font, size: ts * 0.85, color: g.withAlpha(d['colour.text'], 0.7), align });
    }

    function drawCircuit(L, d, c) {
      const s = L.s, S = L.supply, wire = d['colour.wire'], lw = 3 * s;
      const midY = S.y + S.h / 2;
      const negX = L.cathode.side < 0 ? S.x : S.x + S.w;
      const posX = L.anode.side < 0 ? S.x : S.x + S.w;
      const cathPath = [[negX, midY], [L.cathode.cx, midY], [L.cathode.cx, L.cathode.y]];
      const anPath = [[L.anode.cx, L.anode.y], [L.anode.cx, midY], [posX, midY]];
      if (showE('cathode')) g.path(cathPath, wire, lw);
      if (showE('anode')) g.path(anPath, wire, lw);
      // supply box
      g.roundRect(S.x, S.y, S.w, S.h, 6 * s, '#f1f5f9', wire, lw * 0.7);
      const ts = d['text.size'] * s, font = d['text.font'];
      g.text(S.x + S.w / 2, S.y + S.h / 2, 'd.c. supply', { font, size: ts * 0.8, color: d['colour.text'], align: 'center' });
      const [sx] = terminalPos(L, true), [px2] = terminalPos(L, false);
      g.text(sx, S.y + S.h / 2, '−', { font, size: ts * 1.4, color: d['colour.text'], align: 'center', weight: '700' });
      g.text(px2, S.y + S.h / 2, '+', { font, size: ts * 1.4, color: d['colour.text'], align: 'center', weight: '700' });

      const f = flags();
      if (showE('cathode') && (f ? f.eCath : (c.power && c.electrons))) drawElectrons(cathPath, L, d, false);
      if (showE('anode') && (f ? f.eAn : (c.power && c.electrons))) drawElectrons(anPath, L, d, true);
    }

    function terminalPos(L, neg) {
      const S = L.supply, s = L.s, side = neg ? L.cathode.side : L.anode.side;
      return [side < 0 ? S.x + 10 * s : S.x + S.w - 10 * s, S.y + S.h / 2];
    }

    function drawObservation(E, obs, L, d) {
      const s = L.s, font = d['text.font'], size = Math.max(9, d['text.size'] * s * 0.8);
      const lines = obs.icons;
      const o = { font, size, color: d['colour.text'], weight: '600' };
      const w = Math.max(...lines.map(t => g.textWidth(t, o))) + 16 * s;
      const h = lines.length * size * 1.4 + 10 * s;
      // callout sits between the electrodes, cathode one higher, anode one lower, with a pointer to its electrode
      const x = E.side < 0 ? E.x + E.w + 12 * s : E.x - 12 * s - w;
      const y = L.liquid.y + L.liquid.h * (E.name === 'cathode' ? 0.18 : 0.56) - h / 2;
      g.roundRect(x, y, w, h, 8 * s, g.withAlpha('#ffffff', 0.94), '#f59e0b', 2 * s);
      const px0 = E.side < 0 ? x : x + w, py0 = y + h / 2;
      g.line(px0, py0, px0 - E.side * -1 * 0 + (E.side < 0 ? -10 * s : 10 * s), py0, '#f59e0b', 2 * s);
      lines.forEach((t, i) => g.text(x + 8 * s, y + 5 * s + size * 0.7 + i * size * 1.4, t, o));
    }

    function drawHighlight(kind, L, d) {
      const s = L.s, a = 0.55 + 0.45 * Math.sin(time * 5), col = '#f59e0b';
      const ring = (x, y, r) => g.alpha(a, () => g.circle(x, y, r, null, col, 3 * s));
      if (kind === 'ions' || kind === 'cations' || kind === 'anions') {
        ions.forEach(p => {
          if (kind !== 'ions' && (kind === 'cations') !== (p.sp.charge > 0)) return;
          if (!ionShown(C(), p.k)) return;
          const [x, y] = px(p, L); ring(x, y, ionR(p) + 5 * s);
        });
      } else if (kind === 'cathode' || kind === 'anode') {
        const E = L[kind];
        g.alpha(a, () => g.roundRect(E.x - 5 * s, E.y - 5 * s, E.w + 10 * s, E.h + 10 * s, 4 * s, null, col, 3 * s));
      } else if (kind === 'negTerminal' || kind === 'posTerminal') {
        const [x, y] = terminalPos(L, kind === 'negTerminal'); ring(x, y, 15 * s);
      } else if (kind === 'terminals') {
        [true, false].forEach(neg => { const [x, y] = terminalPos(L, neg); ring(x, y, 15 * s); });
      } else if (kind === 'electrodes') {
        ['cathode', 'anode'].forEach(k => { const E = L[k]; g.alpha(a, () => g.roundRect(E.x - 5 * s, E.y - 5 * s, E.w + 10 * s, E.h + 10 * s, 4 * s, null, col, 3 * s)); });
      }
    }

    function wrapF(text, maxW, o) {
      const words = text.split(' '), lines = []; let cur = '';
      words.forEach(w => {
        const t = cur ? cur + ' ' + w : w;
        if (g.formulaWidth(t, o) > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
      });
      if (cur) lines.push(cur);
      return lines;
    }

    function drawBtn(r, label, primary, disabled, d, s) {
      const ts = d['text.size'] * s;
      g.alpha(disabled ? 0.35 : 1, () => {
        g.roundRect(r.x, r.y, r.w, r.h, 8 * s, primary ? '#2563eb' : '#ffffff', primary ? '#2563eb' : g.withAlpha(d['colour.text'], 0.35), 1.5 * s);
        g.text(r.x + r.w / 2, r.y + r.h / 2, label, { font: d['text.font'], size: ts, color: primary ? '#ffffff' : d['colour.text'], align: 'center', weight: '700' });
      });
    }

    function flowNumber(i) { return steps[i].num || 0; }
    function stepLabel(i) {
      const base = steps[i].flow ? 'Step ' + flowNumber(i) + (steps[i].sub || '') : ({ start: 'Start', intro: 'The ions', finish: 'Finish' }[steps[i].key] || '');
      return isStudy() ? base + '   ·   Score ' + score.right + ' / ' + score.total : base;
    }

    function drawFlow(L, d) {
      const s = L.s, font = d['text.font'], text = d['colour.text'];
      const useFull = d['text.flowText'] === 'full';
      ['cathode', 'anode'].forEach(side => {
        if (!showE(side)) return;
        const col = L.flow[side];
        const items = [];
        for (let i = 0; i < storyStep; i++) {
          const st = steps[i];
          if (st.flow && st.flow[side]) items.push({ n: flowNumber(i), label: useFull ? st.text : st.flow[side] });
        }
        if (!items.length) return;
        let size = d['text.flowSize'] * s;
        const pad = 6 * s, gapY = 14 * s, badge = () => size * 1.1;
        let boxes;
        for (;;) {
          const o = { font, size, color: text };
          boxes = items.map(it => {
            const lines = wrapF(it.label, col.w - 2 * pad - badge() - 6 * s, o);
            return { it, lines, h: Math.max(badge() + 2 * pad, lines.length * size * 1.22 + 2 * pad) };
          });
          const total = boxes.reduce((a, b) => a + b.h, 0) + gapY * (boxes.length - 1);
          if (total <= col.h || size <= 7) break;
          size *= 0.92;
        }
        let y = col.y;
        boxes.forEach((b, idx) => {
          const accent = side === 'cathode' ? '#2563eb' : '#dc2626';
          g.roundRect(col.x, y, col.w, b.h, 6 * s, g.withAlpha(accent, 0.07), g.withAlpha(accent, 0.5), 1.2 * s);
          const bx = col.x + pad + badge() / 2, by = y + pad + badge() / 2;
          g.circle(bx, by, badge() / 2, accent);
          g.text(bx, by, String(b.it.n), { font, size: size * 0.8, color: '#fff', align: 'center', weight: '800' });
          const tx = col.x + pad + badge() + 6 * s;
          const ty0 = y + pad + size * 0.6;
          b.lines.forEach((ln, i) => g.formula(tx, ty0 + i * size * 1.22, ln, { font, size, color: text }));
          if (idx < boxes.length - 1) {
            const ax = col.x + col.w / 2;
            g.arrow(ax, y + b.h + 2 * s, ax, y + b.h + gapY - 2 * s, g.withAlpha(text, 0.5), 2 * s, 6 * s);
          }
          y += b.h + gapY;
        });
      });
    }

    function drawStory(L, d) {
      const s = L.s, ts = d['text.size'] * s, font = d['text.font'], text = d['colour.text'];
      const st = steps[storyStep];
      const bx = g.w * 0.02, by = g.h * 0.855, bw = g.w * 0.96, bh = g.h * 0.135;
      g.roundRect(bx, by, bw, bh, 8 * s, g.withAlpha(text, 0.05), g.withAlpha(text, 0.18), 1);
      const btnW = Math.max(74 * s, ts * 4.6), btnH = Math.min(bh * 0.6, 48 * s), gap = 8 * s;
      const nextR = { x: bx + bw - gap - btnW, y: by + (bh - btnH) / 2, w: btnW, h: btnH };
      const backR = { x: nextR.x - gap - btnW * 0.8, y: nextR.y, w: btnW * 0.8, h: btnH };
      btnRects = { next: nextR, back: backR };
      const last = storyStep === steps.length - 1;
      drawBtn(nextR, last ? 'Restart' : 'Next ›', true, false, d, s);
      drawBtn(backR, '‹ Back', false, storyStep === 0, d, s);
      g.text(bx + 12 * s, by + ts * 0.85, stepLabel(storyStep), { font, size: ts * 0.7, color: g.withAlpha(text, 0.6), weight: '700' });
      const textW = backR.x - bx - 24 * s;
      const o = { font, size: ts * 0.95, color: text };
      let lines = wrapF(st.text, textW, o);
      while (lines.length > 3 && o.size > 8) { o.size *= 0.92; lines = wrapF(st.text, textW, o); }
      const lh = o.size * 1.22, y0 = by + ts * 1.55 + o.size * 0.55;
      lines.forEach((ln, i) => g.formula(bx + 12 * s, y0 + i * lh, ln, o));
    }

    function drawElectrons(path, L, d, upward) {
      const s = L.s, es = d['motion.electronSize'], spacing = Math.max(26 * s, 34 * s * es), col = d['colour.electron'];
      const segs = []; let total = 0;
      for (let i = 1; i < path.length; i++) {
        const len = Math.hypot(path[i][0] - path[i - 1][0], path[i][1] - path[i - 1][1]);
        segs.push({ a: path[i - 1], b: path[i], len }); total += len;
      }
      const offset = (electronPhase * 60 * s) % spacing;
      const dotR = 4 * s * es;
      for (let dist = offset; dist < total; dist += spacing) {
        let rem = dist;
        for (const sg of segs) {
          if (rem <= sg.len) {
            const t = rem / sg.len;
            const x = sg.a[0] + (sg.b[0] - sg.a[0]) * t, y = sg.a[1] + (sg.b[1] - sg.a[1]) * t;
            g.circle(x, y, dotR, col, g.darken(col, 0.4), 1);
            if (dotR > 3.5) g.formula(x, y, 'e^-', { size: dotR * 1.3, color: '#1f2937', align: 'center', weight: '700' });
            break;
          }
          rem -= sg.len;
        }
      }
      // direction arrow on the vertical leg
      const vert = segs.find(sg => Math.abs(sg.a[0] - sg.b[0]) < 1);
      if (vert) {
        const ax = vert.a[0] + (L.cathode.side < 0 === (path === undefined) ? 0 : 0) + 12 * s;
        const ay = (vert.a[1] + vert.b[1]) / 2;
        const dir = upward ? -Math.PI / 2 : Math.PI / 2;
        g.arrowHead(ax, ay, dir, g.withAlpha(d['colour.text'], 0.6), 7 * s);
      }
    }

    function drawWater(L, d, c) {
      const s = L.s, n = Math.min(waters.length, Math.round(d['motion.water']));
      const r = d['ion.radius'] * 0.75 * s, col = d['colour.water'];
      for (let i = 0; i < n; i++) {
        const wm = waters[i];
        const x = L.liquid.x + wm.u * L.liquid.w, y = L.liquid.y + wm.v * L.liquid.h;
        g.alpha(0.35, () => {
          g.circle(x, y, r, col);
          g.circle(x + Math.cos(wm.a) * r * 0.9, y + Math.sin(wm.a) * r * 0.9, r * 0.5, '#e2e8f0');
          g.circle(x + Math.cos(wm.a + 1.8) * r * 0.9, y + Math.sin(wm.a + 1.8) * r * 0.9, r * 0.5, '#e2e8f0');
        });
        if (c.labels !== 'none') g.alpha(0.6, () => g.formula(x, y, 'H_2O', { font: d['text.font'], size: r * 0.9, color: '#1e3a8a', align: 'center', weight: '600' }));
      }
    }

    function drawIon(p, L, d, c) {
      const s = L.s, dur = d['motion.discharge'];
      let scale = 1;
      if (p.state === 'emerging') scale = Math.min(1, p.t / 0.5);
      if (p.state === 'discharging') { const k = Math.max(0, (p.t - dur * 0.65) / (dur * 0.35)); scale = Math.max(0.15, 1 - 0.85 * k * k); }
      const r = ionR(p) * scale;
      const [x, y] = px(p, L);
      const col = d['ion.' + p.k + '.colour'];
      if (p.state === 'discharging' && d['layout.glow']) {
        const k = p.t / dur;
        g.alpha(0.5 * (1 - k), () => g.circle(x, y, ionR(p) * (1.2 + k * 1.2), col));
      }
      g.circle(x, y, r, col, d['ion.outline'] ? g.darken(col, 0.35) : null, 1.2 * s);
      const mode = c.labels;
      if (r > 5 && (mode === 'formula' || mode === 'both')) {
        g.formulaFit(x, y, p.sp.formula, { font: d['text.font'], size: r * 0.95, color: g.contrastText(col), align: 'center', weight: '700' }, r * 1.75);
      }
      if (mode === 'name' || mode === 'both') {
        const ts = d['text.size'] * s * d['ion.nameSize'];
        g.text(x, y + r + ts * 0.7, p.sp.name, { font: d['text.font'], size: ts, color: d['colour.text'], align: 'center' });
      }
      if (mode === 'name' && r > 5) {
        g.formulaFit(x, y, p.sp.charge > 0 ? (p.sp.charge > 1 ? p.sp.charge + '+' : '+') : (p.sp.charge < -1 ? (-p.sp.charge) + '−' : '−'),
          { font: d['text.font'], size: r, color: g.contrastText(col), align: 'center', weight: '700' }, r * 1.6);
      }
      // electron transfer during discharge
      if (p.state === 'discharging') {
        // electrons start inside the electrode (its centre line) and travel across the gap into the ion,
        // one after another, during the first 65% of the discharge time; the ion then shrinks into its product
        const E = L[p.electrode];
        const n = Math.abs(p.sp.charge);
        const ex = E.cx, ix = x - p.side * r * 0.35;
        const ecol = d['colour.electron'], er = 6 * s * d['motion.electronSize'];
        const stagger = (dur * 0.65) / (n + 1);
        for (let k = 0; k < n; k++) {
          let t = (p.t - k * stagger) / (dur * 0.65 - (n - 1) * stagger);
          if (t < 0 || t > 1) continue;
          if (p.electrode === 'anode') t = 1 - t;   // electrons leave the ion into the anode
          const bx = ex + (ix - ex) * t, by = y + (k - (n - 1) / 2) * er * 1.6;
          g.circle(bx, by, er, ecol, g.darken(ecol, 0.4), 1.2 * s);
          g.formula(bx, by, 'e^-', { size: er * 1.3, color: '#1f2937', align: 'center', weight: '700' });
        }
      }
    }

    function drawBubble(b, L, d, c, hidden) {
      const s = L.s;
      const x = b.x0 + Math.sin(b.phase) * 3 * s;
      const col = hidden ? '#d1d5db' : productColour(b.k);
      g.alpha(0.9, () => g.circle(x, b.y, b.r, col, g.darken(col, 0.35), 1.2 * s));
      g.alpha(0.6, () => g.circle(x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.25, '#ffffff'));
      if (!hidden && c.labels !== 'none' && b.r > 7 * s) {
        g.formulaFit(x, b.y, SPECIES[b.k].product.formula, { font: d['text.font'], size: b.r * 1.1, color: g.contrastText(col), align: 'center', weight: '700' }, b.r * 1.7);
      }
    }

    function drawProducts(E, L, d, hidden) {
      const s = L.s, el = L[E], ts = d['text.size'] * s, font = d['text.font'];
      let prod, k;
      if (E === 'anode' && R.anodeDissolves) prod = COPPER_ANODE;
      else { k = R[E]; prod = k && SPECIES[k].product; }
      if (!prod) return;
      const count = counts[E];
      if (prod.type === 'gas' && gasCloud[E] > 0) {
        const col = hidden ? '#d1d5db' : productColour(k);
        const cx = el.cx, cy = L.liquid.y - 12 * s;
        g.alpha(gasCloud[E] * (prod.vapour ? 0.85 : 0.6), () => {
          g.ellipse(cx, cy, 42 * s, 12 * s, col);
          g.ellipse(cx - 20 * s, cy - 6 * s, 22 * s, 10 * s, col);
          g.ellipse(cx + 22 * s, cy - 5 * s, 20 * s, 9 * s, col);
        });
      }
      if (hidden || !d['text.showProductLabels'] || count === 0) return;
      let label;
      if (prod.type === 'dissolve') label = 'anode dissolves';
      else label = prod.name + (prod.vapour ? ' vapour' : prod.type === 'gas' ? ' gas' : '') + ' (' + prod.formula + ')';
      const o = { font, size: ts * 0.95, color: d['colour.text'], align: 'center', weight: '600' };
      const lw = g.formulaWidth(label, o) + 16 * s, ly = L.liquid.y - 46 * s;
      g.roundRect(el.cx - lw / 2, ly - ts * 0.75, lw, ts * 1.5, 6 * s, g.withAlpha(d['colour.background'], 0.85));
      g.formula(el.cx, ly, label, o);
    }

    function drawEquations(L, d, c, hidden) {
      const s = L.s, font = d['text.font'], es = d['text.equationSize'] * s, ts = d['text.size'] * s;
      ['cathode', 'anode'].forEach(E => {
        const el = L[E];
        let prod, k;
        if (E === 'anode' && R.anodeDissolves) prod = COPPER_ANODE; else { k = R[E]; prod = k && SPECIES[k].product; }
        if (!prod) return;
        if (c.equations !== 'off' && shownEq[E] && !hidden) {
          g.formulaFit(el.cx, L.eqY, prod.eq, { font, size: es, color: d['colour.text'], align: 'center', weight: '600' }, g.w * 0.46);
        }
        if (d['text.showCounters'] && counts[E] > 0 && !hidden) {
          const unit = prod.type === 'metal' ? 'atoms' : prod.type === 'dissolve' ? 'atoms dissolved' : 'molecules';
          g.formula(el.cx, L.counterY, counts[E] + ' ' + prod.formula + ' ' + unit, { font, size: ts * 0.85, color: g.withAlpha(d['colour.text'], 0.7), align: 'center' });
        }
      });
    }

    ctx.canvas.el.addEventListener('pointerdown', ev => {
      if (!isStory()) return;
      const rect = ctx.canvas.el.getBoundingClientRect();
      const x = ev.clientX - rect.left, y = ev.clientY - rect.top;
      const hit = r => r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
      if (hit(btnRects.next)) action('next');
      else if (hit(btnRects.back)) action('back');
    });

    return { reset, update, draw, action, onControl, get products() { return R; }, get step() { return storyStep; }, get stepCount() { return steps.length; }, get ionCount() { return ions.length; },
      // free ions parked below their target electrode (debug metric for tools/verify.py)
      get stuck() { const L = layout(); return ions.filter(p => { if (p.state !== 'free') return false; const [x, y] = px(p, L); const T = p.sp.charge > 0 ? L.cathode : L.anode; return y > T.y + T.h && Math.abs(T.cx - x) < T.w / 2 + ionR(p) * 2.5; }).length; },
      get busyIons() { return ions.filter(p => p.state !== 'free').map(p => p.k + ':' + p.state + ':' + p.t.toFixed(2)); },
      get speciesCounts() { const o = {}; ions.forEach(p => { o[p.k] = (o[p.k] || 0) + 1; }); return o; },
      questionFor, questionsFor, openQuestion };
  }

  Topics.register({
    id: 'electrolysis',
    title: 'Electrolysis',
    description: 'Ions moving in molten and aqueous electrolytes, discharging at the electrodes.',
    aspect: 0.64,
    presets: PRESETS,
    controls, designSchema, create,
    rules, SPECIES,
    resetControls(ctl) { ctl.set('power', false, true); }
  });
})();
